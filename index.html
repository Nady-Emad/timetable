<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nady Fall 26 Schedule</title>
<meta name="theme-color" content="#07090D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nady Schedule">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@500;600&family=JetBrains+Mono:wght@400;600;700;800&display=swap">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]:not([hidden=until-found i]){display:none!important}
/* Layout: live status console on top, day timeline (default) or week grid below; one dark world on purpose. */
:root {
  color-scheme: dark;
  --bg: #07090D;
  --panel: #0E131A;
  --panel-2: #121922;
  --line: #1D2631;
  --fg: #EEF2F6;
  --muted: #8B97A4;
  --dim: #56616E;
  --live: #3DF5A8;
  --f-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace;
  --f-ar: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; min-height: 100%; overflow-x: hidden; }

.bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(#18202A 1.2px, transparent 1.2px);
  background-size: 22px 22px; animation: drift 40s linear infinite; opacity: .75; }
.bg-glow { position: fixed; inset: -20%; pointer-events: none; z-index: 0;
  background: radial-gradient(40% 30% at 20% 10%, rgba(90,184,255,.10), transparent 70%),
              radial-gradient(35% 30% at 85% 30%, rgba(180,140,255,.08), transparent 70%),
              radial-gradient(40% 35% at 50% 100%, rgba(61,245,168,.06), transparent 70%);
  animation: breathe 14s ease-in-out infinite alternate; }
@keyframes drift { to { background-position: 220px 220px; } }
@keyframes breathe { to { transform: translate3d(3%, -2%, 0) scale(1.05); } }

.wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 28px 20px 56px; display: flex; flex-direction: column; gap: 22px; }

/* header */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .28em; color: var(--muted); text-transform: uppercase; }
.eyebrow .cursor { display: inline-block; width: .6em; height: 1em; background: var(--live); vertical-align: -2px; margin-left: 4px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
h1 { margin: 6px 0 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 58px); letter-spacing: -.01em; line-height: 1; text-wrap: balance; }
h1 .dot { color: var(--live); }
.clock { text-align: right; font-family: var(--f-mono); }
.clock .t { font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clock .t small { font-size: .42em; color: var(--live); margin-left: 6px; }
.clock .d { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.clock .d .ar { font-family: var(--f-ar); letter-spacing: 0; color: var(--fg); margin-left: 6px; }

/* status console */
.status { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 18px; align-items: center;
  padding: 18px 22px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
.status::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 0%, var(--sc-tint, rgba(61,245,168,.10)) 45%, transparent 70%); transform: translateX(-100%); animation: sweep 5s ease-in-out infinite; pointer-events: none; }
@keyframes sweep { 60%, 100% { transform: translateX(100%); } }
.pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--sc, var(--live)); box-shadow: 0 0 0 0 var(--sc, var(--live)); animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sc, var(--live)) 70%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
.status .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .25em; color: var(--sc, var(--live)); text-transform: uppercase; }
.status .what { font-family: var(--f-display); font-size: clamp(19px, 2.6vw, 26px); font-weight: 600; line-height: 1.15; margin-top: 2px; }
.status .sub { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.status .sub b { color: var(--fg); font-weight: 600; font-family: var(--f-mono); }
.status .count { text-align: right; font-family: var(--f-mono); }
.status .count .n { font-size: clamp(24px, 4vw, 36px); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--sc, var(--live)); }
.status .count .u { font-size: 11px; letter-spacing: .2em; color: var(--muted); }
.status .bar { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: #19212B; overflow: hidden; }
.status .bar i { display: block; height: 100%; width: 0; background: var(--sc, var(--live)); border-radius: 6px; transition: width 1s linear; box-shadow: 0 0 12px var(--sc, var(--live)); }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); gap: 4px; }
.seg button, .days button { font: 600 13px/1 var(--f-mono); letter-spacing: .12em; color: var(--muted); background: transparent; border: 0; border-radius: 9px; padding: 11px 16px; cursor: pointer; transition: color .2s, background .2s, transform .15s; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:hover, .days button:hover { color: var(--fg); }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days button { background: var(--panel); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 8px; position: relative; }
.days button .ar { font-family: var(--f-ar); letter-spacing: 0; font-weight: 600; font-size: 12.5px; }
.days button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.days button .today { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); }
button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
button:active { transform: scale(.97); }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 500 13px/1 var(--f-body); cursor: pointer; transition: opacity .25s, border-color .25s, background .25s; min-height: 36px; }
.chip i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }
.chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
.legend.filtering .chip[aria-pressed="false"] { opacity: .45; }
.typekey { display: flex; gap: 8px; align-items: center; font: 700 11px/1 var(--f-mono); letter-spacing: .15em; color: var(--muted); }

/* badges */
.badge { font: 700 10.5px/1 var(--f-mono); letter-spacing: .14em; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
.badge.LEC { background: var(--c, var(--fg)); color: var(--bg); }
.badge.LAB { border: 1px solid var(--c, var(--fg)); color: var(--c, var(--fg)); }
.badge.TUT { border: 1px dashed var(--c, var(--fg)); color: var(--c, var(--fg)); }

/* day timeline */
.dayhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.dayhead h2 { margin: 0; font-family: var(--f-display); font-size: clamp(26px, 4vw, 36px); font-weight: 700; }
.dayhead .ar { font-family: var(--f-ar); font-size: 22px; color: var(--muted); font-weight: 600; }
.dayhead .meta { margin-left: auto; font: 500 12px/1 var(--f-mono); letter-spacing: .14em; color: var(--muted); }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 14px; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.when { display: flex; flex-direction: column; justify-content: center; padding: 10px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.when .k { font-size: 10px; letter-spacing: .22em; color: var(--dim); font-weight: 700; }
.when .v { font-size: 19px; font-weight: 800; line-height: 1.15; }
.when .v small { font-size: 11px; color: var(--c); margin-left: 3px; font-weight: 700; }
.when .v.to { font-size: 15px; color: #C9D2DB; }
.when .v.to small { color: var(--muted); }
.card { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 18px; align-items: center; padding: 16px 20px 16px 22px; border-radius: 16px;
  background: color-mix(in srgb, var(--c) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 22%, transparent); transition: transform .25s, border-color .25s, box-shadow .25s, opacity .3s; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); box-shadow: 0 0 14px var(--c); }
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--c) 45%, transparent); }
.card .top-l { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 600 12.5px/1 var(--f-mono); color: #CFD7DF; letter-spacing: .04em; }
.card .top-l .g { color: var(--muted); font-weight: 500; }
.card h3 { margin: 6px 0 2px; font-family: var(--f-display); font-weight: 600; font-size: clamp(19px, 2.4vw, 24px); color: var(--c); line-height: 1.15; text-wrap: balance; }
.card .who { font-size: 13.5px; color: var(--muted); }
.card .room { text-align: right; font-family: var(--f-mono); }
.card .room .k { font-size: 10px; letter-spacing: .22em; color: var(--dim); font-weight: 700; }
.card .room .v { font-size: clamp(26px, 3.6vw, 36px); font-weight: 800; letter-spacing: .03em; line-height: 1; }
.card .prog { grid-column: 1 / -1; height: 5px; border-radius: 5px; background: rgba(255,255,255,.06); overflow: hidden; margin-top: 8px; }
.card .prog i { display: block; height: 100%; background: var(--c); box-shadow: 0 0 10px var(--c); transition: width 1s linear; }
.row.past .card, .row.past .when { opacity: .42; }
.row.past .card::after { content: "DONE"; position: absolute; right: 14px; top: 10px; font: 700 9.5px/1 var(--f-mono); letter-spacing: .2em; color: var(--dim); }
.row.now .card { border-color: var(--c); animation: glow 2.4s ease-in-out infinite; }
.row.now .when { border-color: var(--c); }
@keyframes glow { 50% { box-shadow: 0 0 0 1px var(--c), 0 0 34px -6px var(--c); } }
.live-tag { display: inline-flex; align-items: center; gap: 6px; font: 700 10.5px/1 var(--f-mono); letter-spacing: .18em; color: var(--bg); background: var(--c); padding: 5px 8px; border-radius: 6px; }
.live-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); animation: blink 1s steps(1) infinite; }
.dimmed { opacity: .18 !important; filter: saturate(.3); }

.gap { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 14px; animation: rise .55s both; animation-delay: calc(var(--i) * 70ms); }
.gap .line { display: flex; align-items: center; gap: 12px; font: 500 12px/1 var(--f-mono); letter-spacing: .14em; color: var(--dim); }
.gap .line::before, .gap .line::after { content: ""; flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); }
.gap.big .line { color: var(--muted); }

.empty { padding: 48px 24px; border-radius: 18px; border: 1px dashed var(--line); text-align: center; color: var(--muted); font-family: var(--f-mono); letter-spacing: .1em; animation: rise .5s both; }
.empty b { display: block; font-family: var(--f-display); color: var(--fg); font-size: 26px; letter-spacing: 0; margin-bottom: 6px; }

/* week grid */
.week-scroll { overflow-x: auto; padding-bottom: 6px; }
.week { min-width: 780px; display: grid; grid-template-columns: 112px repeat(4, minmax(0,1fr)); gap: 10px; }
.wh { padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; animation: rise .5s both; animation-delay: calc(var(--i) * 50ms); }
.wh .en { font: 800 13px/1 var(--f-mono); letter-spacing: .14em; padding: 5px 8px; border-radius: 6px; background: var(--fg); color: var(--bg); }
.wh .ar { font-family: var(--f-ar); color: var(--muted); font-weight: 600; margin-left: auto; }
.wh.is-today { border-color: var(--live); box-shadow: 0 0 20px -8px var(--live); }
.wh.is-today .en { background: var(--live); }
.slot { font-family: var(--f-mono); padding: 12px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; animation: rise .5s both; animation-delay: calc(var(--i) * 50ms); }
.slot .v { font-size: 18px; font-weight: 800; }
.slot .v small { font-size: 10px; color: var(--muted); margin-left: 3px; }
.slot .to { font-size: 12px; color: var(--dim); }
.wc { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 12px 16px; border-radius: 13px; min-height: 150px;
  background: color-mix(in srgb, var(--c) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 22%, transparent); animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 45ms); transition: transform .25s, box-shadow .25s, opacity .3s; cursor: pointer; text-align: left; color: var(--fg); font: inherit; }
.wc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.wc:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -14px color-mix(in srgb, var(--c) 55%, transparent); }
.wc .h { display: flex; justify-content: space-between; gap: 6px; align-items: center; font: 600 11.5px/1 var(--f-mono); color: #CFD7DF; }
.wc .n { font-family: var(--f-display); font-weight: 600; font-size: 16.5px; line-height: 1.15; color: var(--c); }
.wc .w { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wc .f { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; font-family: var(--f-mono); }
.wc .f .tm { font-size: 12px; font-weight: 700; color: #DCE3EA; line-height: 1.3; }
.wc .f .tm span { display: block; color: var(--muted); font-weight: 500; }
.wc .f .rm { font-size: 22px; font-weight: 800; }
.wc.now { border-color: var(--c); animation: rise .55s both, glow 2.4s ease-in-out infinite; }
.wfree { border-radius: 13px; border: 1px dashed #18202A; display: grid; place-items: center; font: 600 11px/1 var(--f-mono); letter-spacing: .3em; color: #2E3844; min-height: 150px; animation: rise .5s both; animation-delay: calc(var(--i) * 45ms); }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font: 500 12px/1.4 var(--f-mono); letter-spacing: .12em; color: var(--dim); padding-top: 6px; border-top: 1px solid var(--line); }

@media (max-width: 640px) {
  .wrap { padding: 20px 16px 40px; }
  .clock { text-align: left; }
  .status { grid-template-columns: auto minmax(0,1fr); padding: 16px; }
  .status .count { grid-column: 1 / -1; text-align: left; display: flex; align-items: baseline; gap: 8px; }
  .row, .gap { grid-template-columns: 92px minmax(0,1fr); gap: 10px; }
  .when { padding: 8px 10px; }
  .when .v { font-size: 16px; }
  .when .v.to { font-size: 13px; }
  .card { padding: 14px 14px 14px 18px; gap: 4px 12px; }
  .card .who { font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---- additions for filters / PWA ---- */
.typekey button{background:transparent;border:0;padding:0;cursor:pointer;transition:opacity .25s}
.typekey.filtering button[aria-pressed="false"]{opacity:.38}
.typekey button[aria-pressed="true"] .badge{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--fg)}
.badge.LEC,.badge.LAB,.badge.TUT{--c:var(--fg)}
.row .badge,.wc .badge{--c:inherit}
.row .card .badge.LEC{background:var(--c);color:var(--bg)}
.sel{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font:600 12px/1 var(--f-mono);letter-spacing:.14em;color:var(--muted)}
.sel select{font:600 13px/1 var(--f-mono);letter-spacing:.08em;color:var(--fg);background:var(--panel-2);border:0;border-radius:9px;padding:11px 12px;min-height:40px;cursor:pointer;max-width:46vw}
.ctl-r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#install{display:none;font:700 12px/1 var(--f-mono);letter-spacing:.14em;color:var(--bg);background:var(--live);border:0;border-radius:10px;padding:12px 16px;min-height:40px;cursor:pointer;box-shadow:0 0 18px -4px var(--live)}
.grps{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:210px}
.grps .k{width:100%;text-align:right;font:700 10px/1 var(--f-mono);letter-spacing:.22em;color:var(--dim)}
.gb{font:700 12px/1 var(--f-mono);letter-spacing:.06em;color:var(--fg);background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:7px;padding:7px 9px;cursor:pointer;min-height:30px;transition:background .2s}
.gb:hover,.gb.on{background:color-mix(in srgb,var(--c) 30%,transparent)}
.wk{min-width:1020px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.wcol{display:flex;flex-direction:column;gap:10px}
.wcol .wc{min-height:0}
.wc .gl{display:flex;flex-wrap:wrap;gap:4px}
.wc .gl span{font:600 10.5px/1 var(--f-mono);padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:#CFD7DF}
.wc .sc{font:600 11.5px/1 var(--f-mono);color:var(--muted)}
.wcol .wfree{min-height:90px}
.wc{cursor:default}
.grps .rv{width:100%;text-align:right;font:800 clamp(24px,3.4vw,34px)/1 var(--f-mono);letter-spacing:.03em}
.wh .b{font-weight:600;font-size:14px}
@media(max-width:640px){.grps{max-width:150px}.card{grid-template-columns:minmax(0,1fr)}.grps,.grps .k{justify-content:flex-start;text-align:left}}
.card .instr { color: var(--muted); }
.wc .w { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>

<main class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">nady@fall-26/27:~$ ./timetable<span class="cursor"></span></div>
      <h1>Weekly<span class="dot">.</span>schedule</h1>
    </div>
    <div class="clock" aria-live="off">
      <div class="t" id="clockT">--:--<small>--</small></div>
      <div class="d" id="clockD">Cairo time</div>
    </div>
  </header>

  <section class="status" id="status" aria-live="polite">
    <div class="pulse" aria-hidden="true"></div>
    <div>
      <div class="lbl" id="stLbl">Loading</div>
      <div class="what" id="stWhat">Checking your day…</div>
      <div class="sub" id="stSub"></div>
    </div>
    <div class="count"><div class="n" id="stN">--</div><div class="u" id="stU"></div></div>
    <div class="bar"><i id="stBar"></i></div>
  </section>

  <div class="controls">
    <div class="ctl-r">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="vDay" aria-pressed="false">DAY</button>
        <button type="button" id="vWeek" aria-pressed="true">WEEK</button>
      </div>
      <button type="button" id="install">INSTALL APP</button>
    </div>
    <div class="days" id="days" role="group" aria-label="Pick a day"></div>
  </div>

  <div class="controls">
    <div class="legend" id="legend" role="group" aria-label="Filter by subject"></div>
  </div>

  <div class="controls">
    <div class="typekey" id="typekey" role="group" aria-label="Filter by session type">
      <button type="button" data-t="LEC" aria-pressed="false"><span class="badge LEC">LECTURE</span></button>
      <button type="button" data-t="LAB" aria-pressed="false"><span class="badge LAB">LAB</span></button>
      <button type="button" data-t="TUT" aria-pressed="false"><span class="badge TUT">TUTORIAL</span></button>
    </div>
    <label class="sel">GROUP <select id="group" aria-label="Filter by group"></select></label>
  </div>

  <section id="view"></section>

  <footer class="foot">
    <span>B.TECH · NETWORK &amp; CYBER SECURITY · BUILDING A</span>
    <span id="totals"></span>
  </footer>
</main>

<script src="data.js"></script>
<script>
(function () {
  var COURSES = {
    'Internet of Things': { k: 'CET321', n: 'Internet of Things', c: '#B48CFF' },
    'Cloud Computing': { k: 'CET322', n: 'Cloud Computing', c: '#5AB8FF' },
    'Probability & Statistics': { k: 'GEN211', n: 'Probability & Statistics', c: '#FFB547' },
    'Security Policy, Threats & Risk Management': { k: 'CET331', n: 'Security Policy, Threats & Risk Mgmt', s: 'Security Policy & Risk', c: '#FF7A9C' },
    'Penetration Testing & Ethical Hacking': { k: 'CET332', n: 'Pen Testing & Ethical Hacking', c: '#FF6B4A' },
    'German Basics': { k: 'HUM115', n: 'German Basics', c: '#C6E26A' }
  };
  var ORDER = ['CET321','CET322','GEN211','CET331','CET332','HUM115'];
  var DAYS = [
    { wd: 0, en: 'SUN', full: 'Sunday', ar: 'الأحد' },
    { wd: 1, en: 'MON', full: 'Monday', ar: 'الإثنين' },
    { wd: 2, en: 'TUE', full: 'Tuesday', ar: 'الثلاثاء' },
    { wd: 3, en: 'WED', full: 'Wednesday', ar: 'الأربعاء' },
    { wd: 4, en: 'THU', full: 'Thursday', ar: 'الخميس' }
  ];
  var TYPE = { LEC: 'LECTURE', LAB: 'LAB', TUT: 'TUTORIAL' };
  var DIDX = { SUN: 0, MON: 1, TUE: 2, WED: 3, THU: 4 };

  function to24(t) { var a = t.split(' '), p = a[0].split(':'), h = +p[0]; if (a[1] === 'PM' && h < 12) h += 12; if (a[1] === 'AM' && h === 12) h = 0; return h * 60 + +p[1]; }
  function t12m(m) { var h = Math.floor(m / 60), mm = m % 60; return { v: ((h % 12) || 12) + ':' + String(mm).padStart(2, '0'), ap: h >= 12 ? 'PM' : 'AM' }; }
  function t12s(m) { var x = t12m(m); return x.v + ' ' + x.ap; }
  function dur(m) { var h = Math.floor(m / 60), r = m % 60; return (h ? h + 'h ' : '') + (r || !h ? r + 'm' : '').trim(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function typeOf(s) { return /^lab/i.test(s) ? 'LAB' : /^tut/i.test(s) ? 'TUT' : 'LEC'; }
  function nat(a, b) { return a.localeCompare(b, undefined, { numeric: true }); }

  // flatten + merge identical sessions (same course/section/day/time) -> list of groups
  var map = {};
  RAW.forEach(function (co) {
    co[1].forEach(function (r) {
      var key = [co[0], r[1], r[2], r[3], r[4]].join('|');
      if (r[5] && map[key]) { map[key].room = r[5]; if (r[6]) map[key].instructor = r[6]; }
      if (!map[key]) map[key] = { code: COURSES[co[0]].k, course: co[0], sec: r[1], t: typeOf(r[1]), d: DIDX[r[2]], sm: to24(r[3]), em: to24(r[4]), room: r[5] || '', instructor: r[6] || '', groups: [] };
      map[key].groups.push(r[0]);
    });
  });
  var S = Object.keys(map).map(function (k) { return map[k]; });
  var BYCODE = {}; Object.keys(COURSES).forEach(function (n) { BYCODE[COURSES[n].k] = COURSES[n]; });
  S.forEach(function (x) { x.groups.sort(nat); });

  // Cairo clock
  var fmtParts = new Intl.DateTimeFormat('en-US', { timeZone: 'Africa/Cairo', weekday: 'short', hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: false, day: 'numeric', month: 'short', year: 'numeric' });
  function cairoNow() {
    var o = {};
    fmtParts.formatToParts(new Date()).forEach(function (p) { o[p.type] = p.value; });
    var wk = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(o.weekday);
    var h = +o.hour % 24;
    return { wd: wk, h: h, m: +o.minute, sec: +o.second, mins: h * 60 + +o.minute + (+o.second) / 60, label: o.weekday + ' · ' + o.day + ' ' + o.month + ' ' + o.year };
  }
  var AR_WEEK = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

  var state = { view: 'week', day: 0, courses: [], types: [], group: '' };
  try {
    var sv = JSON.parse(localStorage.getItem('tt-state2') || '{}');
    if (sv.view) state.view = sv.view;
    if (sv.courses) state.courses = sv.courses.filter(function (k) { return ORDER.indexOf(k) > -1; });
    if (sv.types) state.types = sv.types;
    if (sv.group) state.group = sv.group;
  } catch (e) {}
  var now = cairoNow();
  DAYS.forEach(function (d, i) { if (d.wd === now.wd) state.day = i; });
  function save() { try { localStorage.setItem('tt-state2', JSON.stringify({ view: state.view, courses: state.courses, types: state.types, group: state.group })); } catch (e) {} }

  function visible() {
    return S.filter(function (x) {
      if (state.courses.length && state.courses.indexOf(x.code) < 0) return false;
      if (state.types.length && state.types.indexOf(x.t) < 0) return false;
      if (state.group && x.groups.indexOf(state.group) < 0 && x.groups.indexOf('*') < 0) return false;
      return true;
    }).sort(function (a, b) { return a.sm - b.sm || ORDER.indexOf(a.code) - ORDER.indexOf(b.code) || nat(a.sec, b.sec); });
  }
  function shownGroups(x) { if (x.groups.indexOf('*') > -1) return ['ALL']; return state.group ? [state.group] : x.groups; }

  var daysEl = document.getElementById('days'), legendEl = document.getElementById('legend'), viewEl = document.getElementById('view'), groupEl = document.getElementById('group'), typeEl = document.getElementById('typekey');

  function renderDays() {
    daysEl.innerHTML = DAYS.map(function (d, i) {
      return '<button type="button" data-d="' + i + '" aria-pressed="' + (state.view === 'day' && state.day === i) + '">' +
        (now.wd === d.wd ? '<span class="today" aria-label="today"></span>' : '') + d.en + ' <span class="ar">' + d.ar + '</span></button>';
    }).join('');
  }
  function renderLegend() {
    legendEl.classList.toggle('filtering', state.courses.length > 0);
    legendEl.innerHTML = '<button type="button" class="chip" style="--c:#EEF2F6" data-k="" aria-pressed="' + (state.courses.length === 0) + '"><i></i>ALL SUBJECTS</button>' +
      ORDER.map(function (k) {
        var c = BYCODE[k];
        return '<button type="button" class="chip" style="--c:' + c.c + '" data-k="' + k + '" aria-pressed="' + (state.courses.indexOf(k) > -1) + '"><i></i>' + esc(c.s || c.n) + '</button>';
      }).join('');
  }
  function renderTypes() {
    typeEl.classList.toggle('filtering', state.types.length > 0);
    typeEl.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', state.types.indexOf(b.dataset.t) > -1); });
  }
  function renderGroups() {
    var gs = {};
    S.forEach(function (x) { if (!state.courses.length || state.courses.indexOf(x.code) > -1) x.groups.forEach(function (g) { if (g !== '*') gs[g] = 1; }); });
    var list = Object.keys(gs).sort(nat);
    if (state.group && !gs[state.group]) state.group = '';
    groupEl.innerHTML = '<option value="">ALL GROUPS</option>' + list.map(function (g) { return '<option value="' + esc(g) + '"' + (g === state.group ? ' selected' : '') + '>Group ' + esc(g) + '</option>'; }).join('');
  }

  function timeBlock(m, label) {
    var a = t12m(m);
    return '<div class="k">' + label + '</div><div class="v' + (label === 'TO' ? ' to' : '') + '">' + a.v + '<small>' + a.ap + '</small></div>';
  }
  function gbs(x) {
    return shownGroups(x).map(function (g) { if (g === 'ALL') return '<span class="gb">ALL GROUPS</span>'; return '<button type="button" class="gb' + (g === state.group ? ' on' : '') + '" data-g="' + esc(g) + '">' + esc(g) + '</button>'; }).join('');
  }
  function renderDay(items) {
    var d = DAYS[state.day], list = items.filter(function (x) { return x.d === d.wd; });
    var h = '<div class="dayhead"><h2>' + d.full + '</h2><span class="ar">' + d.ar + '</span><span class="meta">' + list.length + ' SESSION' + (list.length === 1 ? '' : 'S') +
      (list.length ? ' · ' + t12s(list[0].sm) + ' → ' + t12s(Math.max.apply(null, list.map(function (x) { return x.em; }))) : '') + '</span></div>';
    if (!list.length) return viewEl.innerHTML = h + '<div class="empty" style="margin-top:14px"><b>No sessions</b>NOTHING MATCHES THIS DAY + FILTERS</div>';
    h += '<div class="timeline">';
    var i = 0, maxEnd = 0;
    list.forEach(function (x, idx) {
      if (idx > 0) {
        var g = x.sm - maxEnd;
        if (g > 0) h += '<div class="gap' + (g >= 30 ? ' big' : '') + '" style="--i:' + (i++) + '"><div></div><div class="line">' + (g >= 30 ? 'FREE · ' : 'BREAK · ') + dur(g).toUpperCase() + '</div></div>';
      }
      maxEnd = Math.max(maxEnd, x.em);
      var c = BYCODE[x.code];
      h += '<div class="row" data-idx="' + S.indexOf(x) + '" style="--c:' + c.c + ';--i:' + (i++) + '">' +
        '<div class="when">' + timeBlock(x.sm, 'FROM') + timeBlock(x.em, 'TO') + '</div>' +
        '<article class="card"><div><div class="top-l"><span>' + c.k + '</span><span class="g">· ' + esc(x.sec) + '</span><span class="badge ' + x.t + '">' + TYPE[x.t] + '</span><span class="slot-live"></span></div>' +
        '<h3>' + esc(c.n) + '</h3><div class="who">' + (x.instructor ? '<span class="instr">👤 ' + esc(x.instructor) + '</span> · ' : '') + dur(x.em - x.sm) + '</div></div>' +
        '<div class="grps">' + (x.room ? '<div class="rv">' + esc(x.room) + '</div><div class="k">ROOM</div>' : '') + '<div class="k">GROUPS</div>' + gbs(x) + '</div><div class="prog" hidden><i></i></div></article></div>';
    });
    viewEl.innerHTML = h + '</div>';
  }
  function renderWeek(items) {
    var h = '<div class="week-scroll"><div class="wk">', i = 0;
    DAYS.forEach(function (d) {
      var list = items.filter(function (x) { return x.d === d.wd; });
      h += '<div class="wcol"><div class="wh' + (now.wd === d.wd ? ' is-today' : '') + '" style="--i:' + (i++) + '"><span class="en">' + d.en + '</span><span class="ar">' + d.ar + '</span></div>';
      if (!list.length) h += '<div class="wfree" style="--i:' + (i++) + '">FREE</div>';
      list.forEach(function (x) {
        var c = BYCODE[x.code];
        h += '<div class="wc" data-idx="' + S.indexOf(x) + '" style="--c:' + c.c + ';--i:' + (i++) + '">' +
          '<span class="h"><span>' + c.k + '</span><span class="badge ' + x.t + '">' + TYPE[x.t] + '</span></span>' +
          '<span class="n">' + esc(c.n) + '</span><span class="sc">' + esc(x.sec) + '</span>' +
          (x.instructor ? '<span class="w">👤 ' + esc(x.instructor) + '</span>' : '') +
          '<span class="gl">' + shownGroups(x).map(function (g) { return '<span>' + esc(g) + '</span>'; }).join('') + '</span>' +
          '<span class="f"><span class="tm">' + t12s(x.sm) + '<span>→ ' + t12s(x.em) + '</span></span>' + (x.room ? '<span class="rm">' + esc(x.room) + '</span>' : '') + '</span></div>';
      });
      h += '</div>';
    });
    viewEl.innerHTML = h + '</div></div>';
  }

  function render() {
    document.getElementById('vDay').setAttribute('aria-pressed', state.view === 'day');
    document.getElementById('vWeek').setAttribute('aria-pressed', state.view === 'week');
    renderLegend(); renderTypes(); renderGroups(); renderDays();
    var items = visible();
    if (state.view === 'day') renderDay(items); else renderWeek(items);
    document.getElementById('totals').textContent = items.length + ' SESSIONS SHOWN · ' + S.length + ' TOTAL';
    save(); tick();
  }

  daysEl.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.day = +b.dataset.d; state.view = 'day'; render(); });
  document.getElementById('vDay').onclick = function () { state.view = 'day'; render(); };
  document.getElementById('vWeek').onclick = function () { state.view = 'week'; render(); };
  legendEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var k = b.dataset.k;
    if (!k) state.courses = [];
    else { var p = state.courses.indexOf(k); if (p > -1) state.courses.splice(p, 1); else state.courses.push(k); }
    render();
  });
  typeEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var p = state.types.indexOf(b.dataset.t); if (p > -1) state.types.splice(p, 1); else state.types.push(b.dataset.t);
    render();
  });
  groupEl.onchange = function () { state.group = groupEl.value; render(); };
  viewEl.addEventListener('click', function (e) {
    var b = e.target.closest('.gb'); if (!b) return;
    state.group = state.group === b.dataset.g ? '' : b.dataset.g; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // live status (based on the sessions currently shown)
  var stEl = document.getElementById('status');
  function setStatus(color, lbl, what, sub, n, u, pct) {
    stEl.style.setProperty('--sc', color); stEl.style.setProperty('--sc-tint', color + '22');
    document.getElementById('stLbl').textContent = lbl; document.getElementById('stWhat').textContent = what;
    document.getElementById('stSub').innerHTML = sub; document.getElementById('stN').textContent = n;
    document.getElementById('stU').textContent = u; document.getElementById('stBar').style.width = pct + '%';
  }
  function countdown(m) {
    var total = Math.max(0, Math.round(m * 60)), h = Math.floor(total / 3600), mm = Math.floor(total % 3600 / 60), ss = total % 60;
    return (h ? h + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(ss).padStart(2, '0');
  }
  function grpTxt(x) { var g = shownGroups(x); return 'Group' + (g.length > 1 ? 's ' : ' ') + '<b>' + esc(g.join(', ')) + '</b>'; }
  function tick() {
    now = cairoNow();
    var hh = ((now.h % 12) || 12) + ':' + String(now.m).padStart(2, '0') + ':' + String(now.sec).padStart(2, '0');
    document.getElementById('clockT').innerHTML = hh + '<small>' + (now.h >= 12 ? 'PM' : 'AM') + '</small>';
    document.getElementById('clockD').innerHTML = esc(now.label.toUpperCase()) + '<span class="ar">' + AR_WEEK[now.wd] + '</span>';
    var items = visible();
    var cur = items.filter(function (x) { return x.d === now.wd && now.mins >= x.sm && now.mins < x.em; })[0];
    var nx = null;
    if (cur) {
      var c = BYCODE[cur.code], p = (now.mins - cur.sm) / (cur.em - cur.sm) * 100;
      setStatus(c.c, '● In class now', c.n, TYPE[cur.t] + ' · ' + esc(cur.sec) + ' · ' + grpTxt(cur) + ' · until <b>' + t12s(cur.em) + '</b>', countdown(cur.em - now.mins), 'LEFT', p);
    } else {
      for (var k = 0; k < 7 && !nx; k++) {
        var day = (now.wd + k) % 7;
        var l = items.filter(function (x) { return x.d === day && (k > 0 || x.sm > now.mins); });
        if (l.length) nx = { x: l[0], ahead: k };
      }
      if (nx) {
        var c2 = BYCODE[nx.x.code];
        if (nx.ahead === 0) {
          var prev = items.filter(function (x) { return x.d === now.wd && x.em <= now.mins; }).pop();
          var from = prev ? prev.em : Math.min(now.mins, nx.x.sm - 60);
          var p2 = Math.max(0, Math.min(100, (now.mins - from) / (nx.x.sm - from) * 100));
          setStatus(c2.c, 'Next up', c2.n, TYPE[nx.x.t] + ' · ' + esc(nx.x.sec) + ' · ' + grpTxt(nx.x) + ' · starts <b>' + t12s(nx.x.sm) + '</b>', countdown(nx.x.sm - now.mins), 'TO GO', p2);
        } else {
          var dn = DAYS.filter(function (z) { return z.wd === nx.x.d; })[0];
          setStatus(c2.c, nx.ahead === 1 ? 'Done for today · Tomorrow' : 'No classes today · Next', c2.n, dn.full + ' ' + dn.ar + ' · ' + TYPE[nx.x.t] + ' · ' + esc(nx.x.sec) + ' · <b>' + t12s(nx.x.sm) + '</b>', nx.ahead === 1 ? 'TMRW' : dn.en, 'NEXT CLASS', 100);
        }
      } else setStatus('#8B97A4', 'No sessions', 'Nothing matches the filters', 'Change the subject, type or group filter.', '--', '', 0);
    }
    document.querySelectorAll('[data-idx]').forEach(function (el) {
      var x = S[+el.dataset.idx], isToday = x.d === now.wd;
      var live = isToday && now.mins >= x.sm && now.mins < x.em, past = isToday && now.mins >= x.em;
      el.classList.toggle('now', live);
      el.classList.toggle('past', past && el.classList.contains('row'));
      var pr = el.querySelector('.prog');
      if (pr) { pr.hidden = !live; if (live) pr.firstChild.style.width = ((now.mins - x.sm) / (x.em - x.sm) * 100) + '%'; }
      var tag = el.querySelector('.slot-live');
      if (tag) tag.innerHTML = live ? '<span class="live-tag">LIVE</span>' : '';
    });
  }

  render();
  setInterval(tick, 1000);

  // PWA
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  var dp, ib = document.getElementById('install');
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  var wasInstalled = false; try { wasInstalled = localStorage.getItem('tt-installed2') === '1'; } catch (e) {}
  if (!standalone && !wasInstalled) {
    addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dp = e; ib.style.display = 'inline-block'; });
  }
  ib.onclick = function () {
    if (!dp) { alert('Open the browser menu (⋮) and choose "Install app" or "Add to Home screen".'); return; }
    try {
      dp.prompt();
      dp.userChoice.then(function () { dp = null; ib.style.display = 'none'; });
    } catch (err) { alert('Open the browser menu (⋮) and choose "Install app" or "Add to Home screen".'); }
  };
  addEventListener('appinstalled', function () { ib.style.display = 'none'; try { localStorage.setItem('tt-installed2', '1'); } catch (e) {} });
})();
</script>
</body>
</html>
